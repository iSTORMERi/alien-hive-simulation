<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alien Hive Simulation</title>
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            padding: 10px;
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        h1 {
            margin-bottom: 10px;
            font-size: 20px;
            text-align: center;
        }
        
        #gameContainer {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 1400px;
        }
        
        @media (min-width: 1400px) {
            #gameContainer {
                flex-direction: row;
                align-items: flex-start;
            }
        }
        
        #canvasWrapper {
            position: relative;
            overflow: auto;
            max-width: 100%;
            max-height: 70vh;
            border: 2px solid #444;
            background-color: #0a0a0a;
            -webkit-overflow-scrolling: touch; /* Плавная прокрутка на iOS */
        }
        
        #gameCanvas {
            display: block;
            image-rendering: pixelated;
        }
        
        #zoomControls {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 5px;
            z-index: 10;
        }
        
        .zoom-btn {
            width: 36px;
            height: 36px;
            padding: 0;
            font-size: 20px;
            font-weight: bold;
            background-color: rgba(50, 50, 50, 0.9);
            border: 1px solid #666;
            border-radius: 4px;
            color: white;
            cursor: pointer;
        }
        
        .zoom-btn:hover {
            background-color: rgba(80, 80, 80, 0.9);
        }
        
        #sidebar {
            width: 100%;
            background-color: #222;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 10px;
        }
        
        @media (min-width: 1400px) {
            #sidebar {
                width: 280px;
                flex-shrink: 0;
            }
        }
        
        .hive-info {
            margin-bottom: 10px;
            padding: 8px;
            border-radius: 4px;
            background-color: #2a2a2a;
            border-left: 4px solid;
        }
        
        .hive-info h3 {
            margin: 0 0 5px 0;
            font-size: 13px;
        }
        
        .resource-line {
            font-size: 11px;
            margin: 2px 0;
            display: flex;
            justify-content: space-between;
        }
        
        .resource-line span:first-child {
            color: #aaa;
        }
        
        .resource-line span:last-child {
            font-weight: bold;
        }
        
        .units-line {
            font-size: 10px;
            color: #888;
            margin-top: 4px;
            border-top: 1px solid #333;
            padding-top: 4px;
        }
        
        #controls {
            margin-top: 10px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        button {
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
        }
        
        button:hover {
            background-color: #45a049;
        }
        
        #info {
            margin-top: 10px;
            font-size: 12px;
            color: #aaa;
            text-align: center;
        }
        
        .legend {
            margin-top: 10px;
            padding: 8px;
            background-color: #2a2a2a;
            border-radius: 4px;
            font-size: 11px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            margin: 3px 0;
        }
        
        .legend-color {
            width: 12px;
            height: 12px;
            margin-right: 8px;
            border-radius: 2px;
            flex-shrink: 0;
        }
        
        h2 {
            margin-top: 0;
            font-size: 15px;
        }
    </style>
</head>
<body>
    <h1>👽 Alien Hive Simulation</h1>
    
    <div id="gameContainer">
        <div id="canvasWrapper">
            <div id="zoomControls">
                <button class="zoom-btn" id="zoomOutBtn">−</button>
                <button class="zoom-btn" id="zoomResetBtn">⟲</button>
                <button class="zoom-btn" id="zoomInBtn">+</button>
            </div>
            <canvas id="gameCanvas" width="1200" height="1200"></canvas>
        </div>
        
        <div id="sidebar">
            <h2>📊 Статистика ульев</h2>
            <div id="hivesInfo"></div>
            
            <div class="legend">
                <div style="font-weight: bold; margin-bottom: 5px;">Легенда:</div>
                <div class="legend-item">
                    <div class="legend-color" style="background-color: #8B4513;"></div>
                    <span>Био Масса</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background-color: #00FF00;"></div>
                    <span>Био Плазма</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background-color: #708090;"></div>
                    <span>Хитиновая руда</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background-color: #9370DB;"></div>
                    <span>Нейро Кристалл</span>
                </div>
            </div>
        </div>
    </div>
    
    <div id="controls">
        <button id="startBtn">▶ Start</button>
        <button id="pauseBtn">⏸ Pause</button>
    </div>
    <div id="info">
        <span id="fps">FPS: 0</span> | 
        <span id="time">Time: 0s</span>
    </div>
    
    <script src="core/utils.js"></script>
    <script src="core/resources.js"></script>
    <script src="core/map.js"></script>
    <script src="entities/structures.js"></script>
    <script src="entities/units.js"></script>
    <script src="entities/hive.js"></script>
    <script src="systems/pheromones.js"></script>
    <script src="systems/ai.js"></script>
    <script src="systems/combat.js"></script>
    <script src="rendering/renderer.js"></script>
    <script src="main.js"></script>
</body>
</html>
